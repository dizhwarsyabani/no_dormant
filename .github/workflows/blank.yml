name: update data

on:
  schedule:
    # Jalan tiap 2 jam (job maks 6 jam; sleep 350m ≈ 5j50m biar aman margin)
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Jalankan Skrip
        env:
          TEZ: ${{ secrets.TEZ }}
        run: |
          echo "$TEZ" | base64 --decode > ku.sh
          # ku.sh jalan background; log-nya ditail live di console Actions
          # tiap 30 detik → progress build TERLIHAT, tidak buta selama 350m.
          # (Kalau ku.sh gagal di detik pertama, errornya langsung kelihatan.)
          sh ku.sh > ku.log 2>&1 &
          for i in $(seq 1 700); do
            sleep 30
            tail -1 ku.log
          done
          echo "OK!"
          date "+%Y-%m-%d %H:%M:%S" > last_update.txt
          # Commit + push CUKUP last_update.txt saja (bukan data repo lain).
          # [skip ci] biar push ini tidak memicu workflow lagi (anti loop).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_update.txt
          git diff --cached --quiet || git commit -m "update data [skip ci]"
          git push || { git pull --rebase origin main --quiet; git push; }
